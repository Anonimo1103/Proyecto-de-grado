<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Gestión Académica</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: 'Segoe UI', Arial, sans-serif; background: #eef3f8; }
        .login { width: 360px; margin: 80px auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 8px 20px rgba(0,0,0,.15); }
        .login h1 { text-align: center; color: #0d6efd; font-size: 24px; margin-bottom: 5px; }
        .login p  { text-align: center; color: #666; margin-bottom: 25px; margin-top: 0; }
        .role-selector { display: flex; gap: 10px; margin-bottom: 20px; }
        .btn-role { flex: 1; padding: 10px; background: #f8f9fa; color: #333; border: 1px solid #ccc; border-radius: 8px; cursor: pointer; font-size: 14px; transition: 0.3s; }
        .btn-role:hover { background: #e9ecef; }
        .btn-role.active { background: #0d6efd; color: white; border-color: #0d6efd; }
        label { font-size: 14px; font-weight: bold; color: #333; }
        input { width: 100%; padding: 12px; margin: 8px 0 20px; border: 1px solid #ccc; border-radius: 8px; font-size: 15px; }
        .btn-ingresar { width: 100%; padding: 12px; background: #0d6efd; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold; transition: 0.3s; }
        .btn-ingresar:hover { background: #084298; }
        .alerta-ok { background: #d1e7dd; color: #0f5132; padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 15px; display: none; text-align: center; }
        .alerta { color: #dc3545; font-size: 13px; text-align: center; margin-top: 15px; display: none; font-weight: bold; }
        .link-registro { text-align: center; margin-top: 18px; font-size: 13px; color: #555; }
        .link-registro a { color: #0d6efd; text-decoration: none; font-weight: bold; }
        .link-registro a:hover { text-decoration: underline; }
        @media(max-width: 400px) { .login { width: 95%; margin: 30px auto; } }
    </style>
</head>
<body>
<div class="login">
    <h1>📚 Gestión Académica</h1>
    <p>Acceso a la plataforma</p>
    <div class="alerta-ok" id="mensajeRegistro">✅ Cuenta creada correctamente. Ahora puedes iniciar sesión.</div>
    <div class="role-selector">
        <button class="btn-role" id="btnEstudiante" onclick="autocompletar('estudiante')">👨‍🎓 Estudiante</button>
        <button class="btn-role" id="btnDocente"    onclick="autocompletar('docente')">👨‍🏫 Docente</button>
    </div>
    <label>Correo electrónico</label>
    <input type="email" id="correo" placeholder="correo@ejemplo.com">
    <label>Contraseña</label>
    <input type="password" id="password" placeholder="Contraseña">
    <button class="btn-ingresar" onclick="entrar()">Ingresar</button>
    <p id="mensajeError" class="alerta"></p>
    <div class="link-registro">¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a></div>
</div>
<script>
    const params = new URLSearchParams(window.location.search);
    if (params.get('registro') === 'ok') document.getElementById('mensajeRegistro').style.display = 'block';

    function autocompletar(rol) {
        document.getElementById('btnEstudiante').classList.remove('active');
        document.getElementById('btnDocente').classList.remove('active');
        document.getElementById('mensajeError').style.display = 'none';
        if (rol === 'estudiante') {
            document.getElementById('correo').value = 'estudiante@correo.com';
            document.getElementById('password').value = 'estudiante';
            document.getElementById('btnEstudiante').classList.add('active');
        } else {
            document.getElementById('correo').value = 'docente@correo.com';
            document.getElementById('password').value = 'docente';
            document.getElementById('btnDocente').classList.add('active');
        }
    }

    function entrar() {
        const correo = document.getElementById('correo').value.trim().toLowerCase();
        const pass   = document.getElementById('password').value;
        const msjErr = document.getElementById('mensajeError');
        if (!correo || !pass) { msjErr.innerText = 'Por favor, complete todos los campos.'; msjErr.style.display = 'block'; return; }
        if (correo === 'estudiante@correo.com' && pass === 'estudiante') { guardarSesion('Estudiante Demo', correo, 'estudiante'); window.location.href = 'estudiante.html'; return; }
        if (correo === 'docente@correo.com' && pass === 'docente') { guardarSesion('Docente Demo', correo, 'docente'); window.location.href = 'docente.html'; return; }
        const usuarios = JSON.parse(localStorage.getItem('usuarios') || '[]');
        const usuario  = usuarios.find(u => u.correo === correo && u.password === pass);
        if (usuario) { guardarSesion(usuario.nombre, usuario.correo, usuario.rol); window.location.href = usuario.rol === 'docente' ? 'docente.html' : 'estudiante.html'; }
        else { msjErr.innerText = 'Usuario o contraseña incorrectos.'; msjErr.style.display = 'block'; }
    }

    function guardarSesion(nombre, correo, rol) { localStorage.setItem('sesionActiva', JSON.stringify({ nombre, correo, rol })); }
    document.addEventListener('keypress', e => { if (e.key === 'Enter') entrar(); });
</script>
</body>
</html>
